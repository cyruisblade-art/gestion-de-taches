<article class="task-card" [class.task-card--done]="task().done" [attr.aria-label]="'Tâche : ' + task().title">
  <div class="task-card__header">
    <label class="task-card__checkbox-label" [attr.for]="'task-toggle-' + task().id">
      <input
        type="checkbox"
        [id]="'task-toggle-' + task().id"
        [checked]="task().done"
        (change)="onToggle()"
        [attr.aria-label]="'Marquer ' + task().title + ' comme ' + (task().done ? 'active' : 'terminée')"
      />
      <span class="task-card__checkbox-custom"></span>
    </label>

    <div class="task-card__content">
      <a [routerLink]="['/tasks', task().id]" class="task-card__title" [class.task-card__title--done]="task().done">
        {{ task().title }}
      </a>
      <div class="task-card__meta">
        <span class="priority-badge" [class]="'priority-badge--' + task().priority">
          {{ task().priority }}
        </span>
        <span class="task-card__status">
          {{ task().done ? 'Terminée' : 'Active' }}
        </span>

        @if (task().dueDate) {
          <span class="task-card__due" [class.task-card__due--late]="isLate()">
            <svg lucideCalendar [size]="12"></svg>
            {{ formattedDue() }}
          </span>
        }

        @if (subTasksProgress().total > 0) {
          <span class="task-card__subtasks" [title]="subTasksProgress().done + ' sur ' + subTasksProgress().total + ' sous-tâches faites (' + subTasksProgress().percentage + '%)'">
            <svg lucideCheckSquare [size]="12"></svg>
            <span>{{ subTasksProgress().done }}/{{ subTasksProgress().total }}</span>
            <span class="subtask-mini-bar">
              <span class="subtask-mini-bar__fill" [style.width.%]="subTasksProgress().percentage"></span>
            </span>
          </span>
        }

        @for (tag of task().tags; track tag) {
          <span class="task-card__tag" [attr.data-tag]="tag">
            #{{ tag }}
          </span>
        }
      </div>
    </div>
  </div>

  <div class="task-card__actions">
    <a [routerLink]="['/tasks', task().id]" class="btn btn--detail" aria-label="Voir le détail de la tâche">
      <svg lucideClock [size]="15"></svg>
      Détail
    </a>
    <button
      class="btn btn--danger"
      (click)="onRemove()"
      [attr.aria-label]="'Supprimer la tâche ' + task().title"
      id="remove-task-{{ task().id }}"
    >
      <svg lucideTrash2 [size]="15"></svg>
      Supprimer
    </button>
  </div>
</article>
