<article class="task-card" [class.task-card--done]="task().done" [attr.aria-label]="'Tâche : ' + task().title">
  <div class="task-card__header">
    <label class="task-card__checkbox-label" [attr.for]="'task-toggle-' + task().id">
      <input
        type="checkbox"
        [id]="'task-toggle-' + task().id"
        [checked]="task().done"
        (change)="onToggle()"
        [attr.aria-label]="'Marquer ' + task().title + ' comme ' + (task().done ? 'active' : 'terminée')"
      />
      <span class="task-card__checkbox-custom"></span>
    </label>

    <div class="task-card__content">
      <a [routerLink]="['/tasks', task().id]" class="task-card__title" [class.task-card__title--done]="task().done">
        {{ task().title }}
      </a>
      <div class="task-card__meta">
        <span class="priority-badge" [class]="'priority-badge--' + task().priority">
          {{ task().priority }}
        </span>
        <span class="task-card__status">
          {{ task().done ? 'Terminée' : 'Active' }}
        </span>
      </div>
    </div>
  </div>

  <div class="task-card__actions">
    <a [routerLink]="['/tasks', task().id]" class="btn btn--detail" aria-label="Voir le détail de la tâche">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/>
        <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/>
      </svg>
      Détail
    </a>
    <button
      class="btn btn--danger"
      (click)="onRemove()"
      [attr.aria-label]="'Supprimer la tâche ' + task().title"
      id="remove-task-{{ task().id }}"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
        <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
      </svg>
      Supprimer
    </button>
  </div>
</article>
