<form class="task-form" (ngSubmit)="onSubmit()" novalidate aria-label="Formulaire d'ajout de tâche">
  <h2 class="task-form__title">Nouvelle tâche</h2>

  <div class="form-group" [class.form-group--error]="errorMessage()">
    <label for="task-title" class="form-label">
      Titre <span class="form-required" aria-hidden="true">*</span>
    </label>
    <input
      id="task-title"
      type="text"
      class="form-input"
      [value]="title()"
      (input)="onTitleChange($any($event.target).value)"
      placeholder="Décrivez votre tâche…"
      autocomplete="off"
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
      aria-describedby="task-title-error"
      maxlength="120"
    />
    @if (errorMessage()) {
      <p id="task-title-error" class="form-error" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
          <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
        </svg>
        {{ errorMessage() }}
      </p>
    }
  </div>

  <div class="form-group">
    <label for="task-priority" class="form-label">Priorité</label>
    <select
      id="task-priority"
      class="form-select"
      [value]="priority()"
      (change)="priority.set($any($event.target).value)"
    >
      @for (p of priorities; track p) {
        <option [value]="p">{{ p | titlecase }}</option>
      }
    </select>
  </div>

  <!--
    TODO Bonus C : ajoute ici le champ de date limite, sur le modèle du bloc « Priorité » juste au-dessus :
      <div class="form-group">
        <label for="task-due-date" class="form-label">Date limite (facultative)</label>
        <input
          id="task-due-date"
          type="date"
          class="form-input"
          [value]="dueDate()"
          (input)="dueDate.set($any($event.target).value)"
        />
      </div>
  -->

  <button type="submit" class="btn-submit" id="submit-task">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
      <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
    </svg>
    Ajouter la tâche
  </button>
</form>
