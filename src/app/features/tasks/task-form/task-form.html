<form class="task-form" (ngSubmit)="onSubmit()" novalidate aria-label="Formulaire d'ajout de tâche">
  <h2 class="task-form__title">Nouvelle tâche</h2>

  <!-- Titre -->
  <div class="form-group" [class.form-group--error]="errorMessage()">
    <label for="task-title" class="form-label">
      Titre <span class="form-required" aria-hidden="true">*</span>
    </label>
    <input
      id="task-title"
      type="text"
      class="form-input"
      [value]="title()"
      (input)="onTitleChange($any($event.target).value)"
      placeholder="Décrivez votre tâche…"
      autocomplete="off"
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
      aria-describedby="task-title-error"
      maxlength="120"
    />
    @if (errorMessage()) {
      <p id="task-title-error" class="form-error" role="alert">
        <svg lucideAlertCircle [size]="14"></svg>
        {{ errorMessage() }}
      </p>
    }
  </div>

  <!-- Priorité -->
  <div class="form-group">
    <label for="task-priority" class="form-label">Priorité</label>
    <select
      id="task-priority"
      class="form-select"
      [value]="priority()"
      (change)="priority.set($any($event.target).value)"
    >
      @for (p of priorities; track p) {
        <option [value]="p">{{ p | titlecase }}</option>
      }
    </select>
  </div>

  <!-- Date limite + Heure sur la même ligne -->
  <div class="form-row">
    <div class="form-group">
      <label for="task-due-date" class="form-label">
        <svg lucideCalendar [size]="13"></svg>
        Date limite
      </label>
      <input
        id="task-due-date"
        type="date"
        class="form-input"
        [value]="dueDate()"
        (input)="dueDate.set($any($event.target).value)"
      />
    </div>

    <div class="form-group">
      <label for="task-due-time" class="form-label">
        <svg lucideClock [size]="13"></svg>
        Heure
      </label>
      <input
        id="task-due-time"
        type="time"
        class="form-input"
        [value]="dueTime()"
        (input)="dueTime.set($any($event.target).value)"
        [attr.disabled]="!dueDate() ? true : null"
      />
    </div>
  </div>



  <!-- Catégories & Étiquettes (Tags) -->
  <div class="form-group">
    <label class="form-label">
      <svg lucideTag [size]="13"></svg>
      Étiquettes / Tags
    </label>
    <div class="tags-selector">
      @for (tag of defaultTags; track tag) {
        <button
          type="button"
          class="tag-chip"
          [class.tag-chip--selected]="isTagSelected(tag)"
          [attr.data-tag]="tag"
          (click)="toggleTag(tag)"
        >
          {{ tag }}
        </button>
      }
      @for (tag of selectedTags(); track tag) {
        @if (!defaultTags.includes(tag)) {
          <button
            type="button"
            class="tag-chip tag-chip--selected tag-chip--custom"
            (click)="toggleTag(tag)"
          >
            {{ tag }} ×
          </button>
        }
      }
    </div>
    <div class="custom-tag-row">
      <input
        type="text"
        class="form-input form-input--sm"
        [value]="customTagInput()"
        (input)="customTagInput.set($any($event.target).value)"
        (keydown.enter)="$event.preventDefault(); addCustomTag()"
        placeholder="+ Tag personnalisé..."
        maxlength="25"
      />
      <button
        type="button"
        class="btn btn--secondary btn--sm"
        [disabled]="!customTagInput().trim()"
        (click)="addCustomTag()"
      >
        Ajouter
      </button>
    </div>
  </div>

  <button type="submit" class="btn-submit" id="submit-task">
    <svg lucidePlusCircle [size]="16"></svg>
    Ajouter la tâche
  </button>
</form>
